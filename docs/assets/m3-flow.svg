<title id="t">Milestone 3 system flow</title>
<desc id="d">The farmer uses the Next.js PWA, which talks through Caddy to the FastAPI backend. The backend uses the ML models, the database, storage, the recommendation engine and the voice service with Sarvam AI.</desc>
