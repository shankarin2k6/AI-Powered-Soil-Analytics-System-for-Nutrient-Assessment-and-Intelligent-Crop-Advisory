<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b7a4b">
<title>Soil Analytics</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f2;color:#1d2b21;font:18px/1.5 system-ui,sans-serif;text-align:center}
  main{max-width:26rem}
  h1{font-size:1.4rem;margin:.2rem 0 .6rem}
  button{margin-top:1rem;padding:.8rem 1.4rem;border:0;border-radius:.8rem;background:#2b7a4b;color:#fff;font:inherit;font-weight:600}
  @media (prefers-color-scheme:dark){body{background:#101a14;color:#e6efe8}}
</style>
</head>
<body>
<main>
  <h1 id="h"></h1>
  <p id="p"></p>
  <button id="b" onclick="location.reload()"></button>
</main>
<script>
  var T={
    en:["You are offline","This page has not been saved on your phone yet. Connect to the internet once and open it, then it will work without a signal.","Try again"],
    hi:["आप ऑफ़लाइन हैं","यह पेज अभी आपके फ़ोन में सहेजा नहीं गया है। एक बार इंटरनेट से जुड़कर इसे खोलें, फिर यह बिना सिग्नल के भी चलेगा।","फिर कोशिश करें"],
    kn:["ನೀವು ಆಫ್‌ಲೈನ್ ಇದ್ದೀರಿ","ಈ ಪುಟ ಇನ್ನೂ ನಿಮ್ಮ ಫೋನ್‌ನಲ್ಲಿ ಉಳಿಸಲಾಗಿಲ್ಲ. ಒಮ್ಮೆ ಇಂಟರ್ನೆಟ್‌ಗೆ ಸಂಪರ್ಕಿಸಿ ಇದನ್ನು ತೆರೆಯಿರಿ, ನಂತರ ಸಿಗ್ನಲ್ ಇಲ್ಲದೆಯೂ ಕೆಲಸ ಮಾಡುತ್ತದೆ.","ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ"],
    ta:["நீங்கள் ஆஃப்லைனில் உள்ளீர்கள்","இந்தப் பக்கம் இன்னும் உங்கள் தொலைபேசியில் சேமிக்கப்படவில்லை. ஒருமுறை இணையத்தில் இணைந்து இதைத் திறந்தால், பிறகு சிக்னல் இல்லாமலும் வேலை செய்யும்.","மீண்டும் முயலுங்கள்"]
  };
  var l="en"; try{l=localStorage.getItem("lang")||"en"}catch(e){}
  var s=T[l]||T.en; document.documentElement.lang=T[l]?l:"en";
  document.getElementById("h").textContent=s[0]; document.getElementById("p").textContent=s[1]; document.getElementById("b").textContent=s[2];
</script>
</body>
</html>
