# Starts PostgreSQL for development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: soil
      POSTGRES_PASSWORD: soil
      POSTGRES_DB: soil
    ports:
      - "5432:5432"
    volumes:
      - soil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soil"]
      interval: 5s
      retries: 10

volumes:
  soil_pgdata:
